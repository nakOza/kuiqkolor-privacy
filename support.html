<style>
:root{
  color-scheme:dark;
  --bg:#080a10;--panel:#0d111b;--text:#f5f7fb;--muted:#98a3b7;
  --cyan:#35e8ff;--purple:#8b5cf6;--border:rgba(139,92,246,.18)
}
*{box-sizing:border-box}
body{
  margin:0;
  background:
    radial-gradient(700px 360px at 90% -130px,rgba(139,92,246,.16),transparent 68%),
    radial-gradient(620px 330px at -80px -120px,rgba(53,232,255,.09),transparent 68%),
    var(--bg);
  color:var(--text);
  font:15px/1.65 system-ui,-apple-system,Segoe UI,sans-serif
}
main{max-width:860px;margin:auto;padding:52px 20px 72px}
header{display:flex;align-items:center;gap:14px;margin-bottom:30px}
header img{width:52px;height:52px;border-radius:13px}
.brand{
  font-weight:900;font-size:20px;
  background:linear-gradient(90deg,#35e8ff,#8b5cf6,#c56cff,#35e8ff);
  background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent
}
.card{
  border:1px solid var(--border);border-radius:16px;padding:22px;margin:14px 0;
  background:linear-gradient(135deg,rgba(53,232,255,.025),rgba(139,92,246,.04)),rgba(13,17,27,.94)
}
.hero{padding:26px;border-color:rgba(53,232,255,.26)}
h1{margin:0;font-size:38px;line-height:1.08}
h2{margin:0 0 7px;font-size:17px;color:var(--cyan)}
p{color:#cbd3df;margin:8px 0}
ul{color:#cbd3df}
small{color:var(--muted)}
a{color:var(--cyan)}
</style>
</head>
